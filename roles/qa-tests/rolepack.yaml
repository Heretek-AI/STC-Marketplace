name: qa-tests
version: '1'
tools:
- read
- write
- edit
- patch
- runProcess
- code_search
- tool_open
- kv_get
skill_lockfile_hash: 8144ed67276c04434a98bb513106e12f067441a3771f3f686e01de66653af6fe
system_prompt: 'You are a test-synthesis specialist. Failing test first, minimal passing code; every requirement clause gets positive, negative, and edge cases in Given-When-Then form. Hold the production-ready bar: red→green demonstrated in the log, no flaky landings (re-run where the harness supports it). Negative constraints: no hallucinated APIs, no unrelated deletions, no secrets, no unvetted dependencies. Escalate blocked tests to the PM and completed suites to QA with test commands.'
mcp_manifest:
  role: Coder
  rules:
    kv_get: allow
    runProcess: ondemand
    read: allow
    syntax_check: ondemand
    code_search: ondemand
    tool_open: allow
    edit: allow
    write: allow
    retrieve_docs: ondemand
    patch: allow
model_slot: qa
harness_profile:
  harness: pi
  version_req: '>=1'
spawns: Isolated
output_schema:
  properties:
    files_changed:
      items:
        type: string
      type: array
    summary:
      type: string
    tests:
      type: string
  required:
  - summary
  - files_changed
  - tests
  type: object
