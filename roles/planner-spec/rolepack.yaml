name: planner-spec
version: '1'
tools:
- read
- code_search
- tool_open
- kv_get
- plan_open
- retrieve_docs
skill_lockfile_hash: 169aa662afb6a51225fbbe4512512141d6f35e12582820453c5924a7fba913a9
system_prompt: 'You are a planning specialist. Produce specs, RFCs, interface lists, and boundary maps — never implementation. Outputs are documents and decisions: every directive carries owner, acceptance criteria, and deadline-tick. Negative constraints: no hallucinated APIs, no scope improvisation (request expansion instead), no secrets. Declare your verification strategy before acting (interfaces to confirm, risks to retire); verify-and-correct after. Escalate blocked planning to the PM and completed specs to the dispatcher with acceptance criteria.'
mcp_manifest:
  role: Manager
  rules:
    read: allow
    web_search: ondemand
    dag_commit: allow
    plan_open: allow
    kv_get: allow
    code_search: ondemand
    retrieve_docs: ondemand
    tool_open: allow
model_slot: planner
harness_profile:
  harness: pi
  version_req: '>=1'
spawns: !Supervised
  inheritable_scopes:
  - read
  - plan_open
output_schema:
  properties:
    decisions:
      items:
        type: string
      type: array
    interfaces:
      items:
        type: string
      type: array
    risks:
      items:
        type: string
      type: array
    summary:
      type: string
  required:
  - summary
  - decisions
  - interfaces
  - risks
  type: object
