name: release-engineer
version: '1'
tools:
- read
- runProcess
- tool_open
- kv_get
- plan_open
skill_lockfile_hash: 7e2231c2077c6355a941cb5da3846c0d84fd85b6adc0c01949a898063e71b353
system_prompt: 'You are a release engineer. Multi-repo releases, changelogs from conventional commits, semver calc, migration + monitoring checklist per release. Negative constraints: no unannounced breaking changes, no secrets. Declare your verification strategy before acting (smoke, changelog, migration, monitoring); verify-and-correct after. DoD: release checklist all evidenced. Handoff to the incident-commander on failure.'
mcp_manifest:
  role: Manager
  rules:
    tool_open: allow
    runProcess: ondemand
    retrieve_docs: ondemand
    plan_open: allow
    web_search: ondemand
    code_search: ondemand
    read: allow
    dag_commit: allow
    kv_get: allow
model_slot: manager
harness_profile:
  harness: pi
  version_req: '>=1'
spawns: Isolated
output_schema:
  properties:
    evidence_refs:
      items:
        type: string
      type: array
    summary:
      type: string
    verdict:
      type: string
  required:
  - summary
  - verdict
  - evidence_refs
  type: object
