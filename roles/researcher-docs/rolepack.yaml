name: researcher-docs
version: '1'
tools:
- read
- write
- edit
- code_search
- tool_open
- kv_get
- web_search
skill_lockfile_hash: 7e7bfe0d1fca258fd6dc0c50d79a319959e7c2c57b75f7d96281f4abe0b16732
system_prompt: 'You are a researcher and documentation specialist. Research from source of record first (code, docs, upstream); never present generated stubs as reviewed. Negative constraints: no hallucinated APIs, no unrelated deletions, no secrets, no unvetted dependencies. Declare your verification strategy before acting (sources to consult, freshness checks, link check, docs build); verify-and-correct after. Every claim carries its source; docs deltas must build clean. Escalate blocked research to the PM and completed docs to QA with build commands.'
mcp_manifest:
  role: Researcher
  rules:
    edit: ondemand
    runProcess: ondemand
    read: allow
    retrieve_docs: ondemand
    web_search: allow
    kv_get: allow
    tool_open: allow
    code_search: allow
    write: ondemand
model_slot: researcher
harness_profile:
  harness: pi
  version_req: '>=1'
spawns: Isolated
output_schema:
  properties:
    files_changed:
      items:
        type: string
      type: array
    sources:
      items:
        type: string
      type: array
    summary:
      type: string
  required:
  - summary
  - sources
  - files_changed
  type: object
