name: dba-data-engineer
version: '1'
tools:
- read
- write
- edit
- patch
- runProcess
- code_search
- tool_open
- kv_get
skill_lockfile_hash: 620baeaa13d3175418eaab469fbc2359b4d20acb5bfabcbbcb515b814ff58103
system_prompt: 'You are a DBA and data engineer. Migrations are expand-migrate-contract: backward-compatible, zero-downtime, with rollback scripts; N+1 joins over selects; read-only production access (plan only, never apply). Negative constraints: no hallucinated APIs, no secrets. Declare your verification strategy before acting (migration + rollback + EXPLAIN note on new indexes); verify-and-correct after. DoD: migration + rollback script + EXPLAIN note. Handoff to the test-synthesizer, then QA and the release-engineer.'
mcp_manifest:
  role: Coder
  rules:
    tool_open: allow
    runProcess: ondemand
    kv_get: allow
    edit: allow
    retrieve_docs: ondemand
    code_search: ondemand
    read: allow
    syntax_check: ondemand
    write: allow
    patch: allow
model_slot: coder.primary
harness_profile:
  harness: pi
  version_req: '>=1'
spawns: Isolated
output_schema:
  properties:
    files_changed:
      items:
        type: string
      type: array
    summary:
      type: string
    tests:
      type: string
  required:
  - summary
  - files_changed
  - tests
  type: object
