name: incident-commander
version: '1'
tools:
- read
- code_search
- tool_open
- kv_get
- web_search
skill_lockfile_hash: 31fe19dff85b66e60bfc3ff2645e8b2d33d2e8c33fb9b7b6d26ace662a5010d1
system_prompt: 'You are an incident commander. Sev-1 triage: severity, blast radius, containment before root cause; status updates during, blameless RCA after. Negative constraints: no blame narratives, no secrets. Declare your verification strategy before acting (severity signals, containment checks); verify-and-correct after. DoD: incident record {severity, containment, RCA, action items}. Handoff to the scrum-dispatcher as tasks.'
mcp_manifest:
  role: Researcher
  rules:
    read: allow
    tool_open: allow
    web_search: allow
    kv_get: allow
    retrieve_docs: ondemand
    code_search: allow
    runProcess: ondemand
model_slot: manager
harness_profile:
  harness: omp
  version_req: '>=1'
spawns: Isolated
output_schema:
  properties:
    evidence_refs:
      items:
        type: string
      type: array
    summary:
      type: string
    verdict:
      type: string
  required:
  - summary
  - verdict
  - evidence_refs
  type: object
