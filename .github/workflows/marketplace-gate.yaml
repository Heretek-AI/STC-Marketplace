name: marketplace-gate
on:
  pull_request:
    paths: ["roles/**", "profiles/**", "skills/**", ".github/**"]
  push:
    branches: [main]
    paths: ["roles/**", "profiles/**", "skills/**", ".github/**"]

jobs:
  verify-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pack schema + lock + secret check
        run: python3 .github/check_packs.py
